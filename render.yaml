services:
  - type: web
    name: vertexia-cloud-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:cloud
    startCommand: node cloud-dist/cloud-server/index.mjs
    healthCheckPath: /api/cloud/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: vertexia_cloud
      - key: CLOUD_JWT_SECRET
        sync: false
      - key: CLOUD_NODE_HMAC_SECRET
        sync: false
      - key: CLOUD_CORS_ORIGINS
        sync: false
