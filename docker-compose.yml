services:
  postgres:
    image: postgres:16-alpine
    container_name: vertexia-retail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vertexia_dev_pg_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vertexia_central}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vertexia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vertexia_central}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vertexia_pg_data:
